<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In | Ofetech Logistic</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="page-alt">
  <header class="site-header simple-header">
    <div class="container header-inner">
      <div class="logo">
        <span class="logo-mark">O</span>
        <span class="logo-text">Ofetech <span>Logistics</span></span>
      </div>
      <nav class="nav-desktop">
        <a href="index.html">Home</a>
        <a href="driver-signup.html" class="nav-link-primary">Become a Driver</a>
      </nav>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Log in</h1>
      <p class="auth-subtitle">
        This is a preview login screen. Once we connect a backend (Supabase, Firebase, or your own API),
        it will authenticate shippers and drivers.
      </p>

      <form id="login-form">
        <label>
          Email
          <input type="email" name="email" required />
        </label>
        <label>
          Password
          <input type="password" name="password" required />
        </label>
        <label class="checkbox-row">
          <input type="checkbox" name="remember" />
          <span>Keep me signed in</span>
        </label>

        <button type="submit" class="btn-primary-full">Continue</button>
        <p class="form-note" id="login-result"></p>
      </form>

      <p class="auth-footer-link">
        New shipper or driver? <a href="driver-signup.html">Start application →</a>
      </p>
    </div>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
